[project]
name = "media-core-mcp"
version = "1.5.0"
description = "MCP server for MedIA audiovisual processing"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2,<2",
    "chromadb>=1.1,<2",
    "httpx>=0.27,<1",
    "mcp>=1.28,<2",
    "python-dotenv>=1,<2",
    "replicate>=1,<2",
    "piper-tts==1.8.0",
    "sentence-transformers>=5,<6",
    "pillow>=12.3.0",
    "rapidocr-onnxruntime>=1.4.4",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-p", "no:capture"]
